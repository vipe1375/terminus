<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Admin — Metro du jour</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="optionsContainer">
    <h3>Réglages</h3>
    <label>Rayon (m) <input type="number" id="radius" /></label>
    <label>Essais max <input type="number" id="guesses" /></label>
    <label class="option"><input type="checkbox" id="defStreets" /> Rues par défaut</label>
    <label class="option"><input type="checkbox" id="defLines" /> Lignes par défaut</label>
    <label class="option"><input type="checkbox" id="defNeighbours" /> Voisins par défaut</label>
    <label class="option"><input type="checkbox" id="defRotation" /> Rotation par défaut</label>
    <label>Mot de passe <input type="password" id="password" /></label>
    <button id="save">Enregistrer</button>
    <p id="status"></p>
  </div>
  <script src="js/admin.js"></script>
</body>
</html>
