<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Untitled Metro Game</title>
        
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
            crossorigin=""
        />
        <link rel="stylesheet" href="style.css" />
        <script
            src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""
        ></script>
        <script src="js/leaflet-rotate.js"></script>
    </head>
    <body>
        <div class="headerContainer">
            Untitled Metro Game
        </div>

        <div id="options" class="optionsContainer">
            <label class="option">
                <button id="mapRotationOption" class="option-btn">Orienter la carte au nord</button> <span style="color: red;">-50</span>
            </label>
        
            <label class="option">
                <button id="streetsNamesOption" class="option-btn">Afficher les noms des rues</button><span style="color: red;">-50</span>
            </label>          
            <label class="option">
                <button id="linesOption" class="option-btn">Afficher les lignes</button> <span style="color: red;">-100</span>
            </label>
            <label class="option">
                <button id="neighboursOption" class="option-btn">Afficher les stations voisines</button> <span style="color: red;">-100</span>
            </label>
        </div>

        <div id="pointsText" class="pointsText"></div>

        <div class="mapContainer">
            <div class="mapCircle">
                <div id="map"></div>
            </div>
        </div>

        <form id="guessForm" autocomplete="off">
            <div class="autocomplete">
                <input
                    id="guess"
                    type="text"
                    placeholder="Entrez une station"
                />
                <button type="submit">OK</button>
            </div>
        </form>

        <div id="attempts" class="attemptsContainer"></div>

        <footer style="margin-top: 20px; padding: 10px; font-size: 12px;">
            <a href="/mentions.html">Mentions légales & crédits</a>
        </footer>

        <script src="js/game.js"></script>
    </body>
</html>
