<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Untitled Metro Game</title>
        
        <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
        <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <!--<div class="headerContainer">
            Untitled Metro Game
        </div>-->
        <h1>Untitled Metro Game</h1>

        <div id="options" class="optionsContainer">
            <!--<label class="option">
                <button id="mapRotationOption" class="option-btn">Orienter la carte au nord</button> <span style="color: red;">-50</span>
            </label>-->
        
            <label class="option">
                <button id="streetsNamesOption" class="option-btn">Afficher les noms des rues</button><span id="streetsPoints" style="color: red;">-50</span>
            </label>          
            <label class="option">
                <button id="linesOption" class="option-btn">Afficher les lignes</button> <span id="linesPoints" style="color: red;">-100</span>
            </label>
            <label class="option">
                <button id="neighboursOption" class="option-btn">Afficher les stations voisines</button> <span id="neighboursPoints" style="color: red;">-100</span>
            </label>
        </div>

        <div id="gameInfo">
            <div id="pointsText" class="pointsText"></div>
    
            <div class="difficultyText">
                <span id="difficultyDot"></span>
                <span id="difficultyText"></span>
            </div>
        </div>
        
        <div class="mapContainer">
            <div class="mapCircle">
                <div id="map"></div>
            </div>
        </div>

        <div class="difficultyText">
            <span id="difficultyDot"></span>
            <span id="difficultyText"></span>
        </div>

        <form id="guessForm" autocomplete="off">
            <div class="autocomplete">
                <input
                    id="guess"
                    type="text"
                    placeholder="Entrez une station"
                />
                <button id="guessButton" type="submit">OK</button>
            </div>
        </form>

        <div id="attempts" class="attemptsContainer"></div>

        <footer style="margin-top: 20px; padding: 10px; font-size: 12px;">
            <a href="/mentions.html">Mentions légales & crédits</a>
        </footer>

        <script src="js/game.js"></script>
    </body>
</html>
